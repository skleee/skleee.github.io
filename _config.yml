# Site
locale: "en-US"
title: "Sunkyung Lee"
name: "Sunkyung Lee"
description: "Information retrieval, natural language processing, and generative recommendation."
url: "https://skleee.github.io"
baseurl: ""
repository: "skleee/skleee.github.io"
timezone: America/Los_Angeles

# Profile and professional links
author:
  name: "Sunkyung Lee"
  avatar: "profile.jpg"
  bio: "Ph.D. candidate at SKKU"
  location: "South Korea"
  email: "sk1027@skku.edu"
  github: "skleee"
  linkedin: "sunkyunglee"
  googlescholar: "https://scholar.google.com/citations?hl=ko&user=cg7RAp0AAAAJ"
  orcid: "https://orcid.org/0000-0002-8178-6708"

# Keep the existing visitor analytics integration.
analytics:
  provider: "custom"

# Content and rendering
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: modern

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
